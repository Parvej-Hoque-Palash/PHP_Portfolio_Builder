# Netlify build settings (the SPA fallback lives in public/_redirects).
# Set the VITE_* environment variables in the Netlify UI before deploying — see README.md.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Asked for by the "Deploy to Netlify" button (see README.md).
[template.environment]
  OWNER_EMAIL = "Your Gmail address — only this account can complete /setup and own the site"
